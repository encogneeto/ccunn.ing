baseURL = 'https://ccunn.ing/'
locale = 'en-us'
title = 'Caleb Cunningham'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[module]
  [[module.imports]]
    path = "github.com/jpanther/congo/v2"

[params]
colorScheme = "ocean"
defaultAppearance = "dark"

[params.header]
layout = "basic"
showTitle = false

[params.homepage]
layout = "profile"


[params.footer]
showAppearanceSwitcher = true

[params.author]
  links = [
    { lemmy = "https://lemmy.world/u/ccunning" },
    { mastodon = "https://mastodon.world/@ccunning" },
    { pixelfed = "https://pixelfed.social/ccunning" },
  ]